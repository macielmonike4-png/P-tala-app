ight:650;overflow-wrap:anywhere}.itemmeta{font-size:12px;color:var(--muted);margin-top:3px}.check{width:22px;height:22px;accent-color:var(--deep);flex-shrink:0}.pill{display:inline-block;border-radius:99px;padding:4px 9px;background:var(--pink);font-size:12px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:13px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea,input,select,textarea{max-width:100%}.field input,.field select,.field textarea,.control{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);color:var(--text)}textarea{min-height:85px;resize:vertical}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 13px;border-radius:99px}.tab.active{background:var(--deep);color:#fff;border-color:var(--deep)}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-around;gap:2px;padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}.navbtn{border:0;background:transparent;color:var(--muted);display:grid;justify-items:center;gap:2px;font-size:10px;min-width:0;flex:1;padding:4px 1px}.navbtn span:first-child{font-size:20px}.navbtn.active{color:var(--deep);font-weight:750}.modalback{position:fixed;inset:0;background:#1c101b80;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(100%,620px);max-height:92vh;overflow:auto;background:var(--surface);border-radius:24px;padding:20px;box-shadow:0 20px 60px #0003}.modal h2{margin:0 0 8px}.modalfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.metric{font-size:26px;font-weight:800;letter-spacing:-1px}.modulehead{border-radius:18px;padding:15px;background:var(--modlight,var(--pink));margin-bottom:15px}.modulehead h2{margin:0 0 3px}.progress{height:8px;background:var(--line);b
